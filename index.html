<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПДД 2026: Визуальный тренажер ГИБДД (30 вопросов)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .svg-canvas {
            width: 100%;
            height: 100%;
            max-height: 320px;
            background-color: #0f172a;
            border-radius: 0.75rem;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🚗</span>
                <h1 class="text-xl font-bold text-emerald-400">ПДД 2026: Тренажер ГИБДД</h1>
            </div>
            <div id="score-badge" class="bg-slate-700 text-emerald-300 font-semibold px-4 py-1.5 rounded-full text-sm border border-slate-600">
                Счет: <span id="current-score">0</span> / <span id="total-questions-badge">30</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center">

        <!-- Progress Bar -->
        <div class="mb-6">
            <div class="flex justify-between text-xs font-semibold text-slate-400 mb-2">
                <span id="question-tracker">Вопрос 1 из 30</span>
                <span id="progress-percent">3%</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
                <div id="progress-bar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-300" style="width: 3.33%;"></div>
            </div>
        </div>

        <!-- Quiz Card -->
        <div id="quiz-card" class="bg-slate-800 border border-slate-700 rounded-2xl p-5 md:p-7 shadow-2xl flex flex-col gap-6">

            <!-- SVG Graphic Box -->
            <div class="w-full flex justify-center items-center overflow-hidden shadow-inner border border-slate-700/50 rounded-xl bg-slate-950 p-2">
                <div id="svg-container" class="w-full flex justify-center">
                    <!-- SVG diagram injected dynamically -->
                </div>
            </div>

            <!-- Question Text -->
            <div>
                <div class="inline-block bg-emerald-500/10 text-emerald-400 text-xs font-bold px-3 py-1 rounded-md mb-2 border border-emerald-500/20" id="topic-tag">
                    Тема
                </div>
                <h2 id="question-text" class="text-lg md:text-xl font-semibold text-slate-100 leading-snug">
                    Загрузка вопроса...
                </h2>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="grid grid-cols-1 gap-3">
                <!-- Buttons injected dynamically -->
            </div>

            <!-- Rationale Box -->
            <div id="explanation-box" class="hidden p-4 rounded-xl border transition-all">
                <div class="font-bold text-sm mb-1 flex items-center gap-2" id="explanation-title">
                    <!-- Header -->
                </div>
                <p id="explanation-text" class="text-sm text-slate-300 leading-relaxed">
                    <!-- Rationale -->
                </p>
            </div>

            <!-- Action Footer -->
            <div class="flex justify-end pt-2 border-t border-slate-700/50">
                <button id="next-btn" onclick="nextQuestion()" class="hidden bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-slate-950 font-bold px-6 py-2.5 rounded-xl transition shadow-lg shadow-emerald-500/20">
                    Следующий вопрос →
                </button>
            </div>
        </div>

        <!-- End Screen -->
        <div id="end-card" class="hidden bg-slate-800 border border-slate-700 rounded-2xl p-8 text-center flex flex-col items-center gap-6 shadow-2xl">
            <div class="text-6xl">🏆</div>
            <h2 class="text-2xl font-bold text-white">Тестирование завершено!</h2>
            <p class="text-slate-300 max-w-md">
                Вы ответили правильно на <span id="final-score" class="text-emerald-400 font-bold text-xl">0</span> из 30 вопросов.
            </p>
            <div id="feedback-message" class="text-sm text-slate-400 max-w-md bg-slate-900 p-4 rounded-xl border border-slate-700">
                <!-- Feedback -->
            </div>
            <button onclick="restartQuiz()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-8 py-3 rounded-xl transition shadow-lg shadow-emerald-500/20">
                Пройти заново 🔄
            </button>
        </div>

    </main>

    <script>
        const questions = [
            // 1. Светофор vs Знаки
            {
                id: 1,
                topic: "Приоритет сигналов",
                question: "Перекресток регулируется светофором. Горит зеленый сигнал, под ним висит знак 2.4 «Уступи дорогу». Вы едете прямо, встречный автомобиль поворачивает налево. Кто проедет первым?",
                svg: `<svg viewBox="0 0 400 280" class="svg-canvas">
                    <rect width="400" height="280" fill="#0f172a"/>
                    <rect x="0" y="90" width="400" height="100" fill="#334155"/>
                    <rect x="150" y="0" width="100" height="280" fill="#334155"/>
                    <line x1="200" y1="0" x2="200" y2="90" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8 8"/>
                    <line x1="200" y1="190" x2="200" y2="280" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8 8"/>
                    <line x1="0" y1="140" x2="150" y2="140" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8 8"/>
                    <line x1="250" y1="140" x2="400" y2="140" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8 8"/>
                    <!-- Вы -->
                    <g transform="translate(165, 210)">
                        <rect width="30" height="50" rx="6" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
                        <text x="15" y="30" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">ВЫ</text>
                        <path d="M15 -5 L15 -25 M10 -18 L15 -27 L20 -18" stroke="#38bdf8" stroke-width="3" fill="none"/>
                    </g>
                    <!-- Встречный -->
                    <g transform="translate(205, 20)">
                        <rect width="30" height="50" rx="6" fill="#dc2626" stroke="#fca5a5" stroke-width="2"/>
                        <text x="15" y="30" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">ВСТР</text>
                        <path d="M15 55 Q15 95 -20 95" stroke="#ef4444" stroke-dasharray="4 4" stroke-width="3" fill="none"/>
                    </g>
                    <!-- Светофор Зеленый -->
                    <g transform="translate(120, 190)">
                        <rect width="20" height="45" rx="4" fill="#1e293b" stroke="#64748b"/>
                        <circle cx="10" cy="10" r="4" fill="#334155"/>
                        <circle cx="10" cy="22.5" r="4" fill="#334155"/>
                        <circle cx="10" cy="35" r="5" fill="#22c55e"/>
                    </g>
                    <!-- Знак Уступи -->
                    <g transform="translate(120, 240)">
                        <polygon points="10,0 0,20 20,20" fill="#fff" stroke="#dc2626" stroke-width="3"/>
                    </g>
                </svg>`,
                options: [
                    { text: "Вы (синий автомобиль)", isCorrect: true, rationale: "Работающий светофор полностью отменяет действие знаков приоритета. Вы едете на зеленый прямо, а встречный при повороте налево уступает вам." },
                    { text: "Встречный автомобиль", isCorrect: false, rationale: "Знак «Уступи дорогу» отменен работающим зеленым сигналом светофора." }
                ]
            },

            // 2. Регулировщик боком
            {
                id: 2,
                topic: "Сигналы регулировщика",
                question: "Регулировщик обращен к вам боком, его руки опущены (или вытянуты в стороны). В каких направлениях вам разрешено движение?",
                svg: `<svg viewBox="0 0 400 280" class="svg-canvas">
                    <rect width="400" height="280" fill="#0f172a"/>
                    <rect x="0" y="90" width="400" height="100" fill="#334155"/>
                    <rect x="150" y="0" width="100" height="280" fill="#334155"/>
                    <!-- Регулировщик -->
                    <g transform="translate(200, 140)">
                        <circle cx="0" cy="0" r="12" fill="#f59e0b"/>
                        <line x1="-30" y1="0" x2="30" y2="0" stroke="#f8fafc" stroke-width="5"/>
                        <text x="0" y="4" fill="#000" font-size="9" font-weight="bold" text-anchor="middle">РЕГ</text>
                    </g>
                    <!-- Вы -->
                    <g transform="translate(165, 210)">
                        <rect width="30" height="50" rx="6" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
                        <text x="15" y="30" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">ВЫ</text>
                    </g>
                </svg>`,
                options: [
                    { text: "Прямо и направо", isCorrect: true, rationale: "«Если палка смотрит вправо — ехать не имеешь права. Если боком встал к тебе — весело кати себе (прямо и направо)»." },
                    { text: "Только прямо", isCorrect: false, rationale: "Поворот направо со стороны правого/левого бока также разрешен." },
                    { text: "Во всех направлениях", isCorrect: false, rationale: "Поворот налево и разворот при таком положении запрещены." }
                ]
            },

            // 3. Круговое движение
            {
                id: 3,
                topic: "Круговое движение",
                question: "Вы въезжаете на перекресток со знаком 4.3 «Круговое движение». Знаков приоритета нет. Кто имеет преимущество?",
                svg: `<svg viewBox="0 0 400 280" class="svg-canvas">
                    <rect width="400" height="280" fill="#0f172a"/>
                    <circle cx="200" cy="140" r="90" fill="#334155"/>
                    <circle cx="200" cy="140" r="45" fill="#0f172a"/>
                    <rect x="170" y="210" width="60" height="70" fill="#334155"/>
                    <!-- Вы -->
                    <g transform="translate(185, 225)">
                        <rect width="30" height="45" rx="5" fill="#2563eb"/>
                        <text x="15" y="26" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">ВЫ</text>
                    </g>
                    <!-- Машина на кольце -->
                    <g transform="translate(110, 120)">
                        <rect width="45" height="30" rx="5" fill="#dc2626"/>
                        <text x="22" y="19" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">КРУГ</text>
                    </g>
                    <!-- Знак 4.3 -->
                    <g transform="translate(240, 220)">
                        <circle cx="15" cy="15" r="15" fill="#2563eb" stroke="#fff" stroke-width="2"/>
                        <path d="M 8 18 A 8 8 0 1 1 20 20" stroke="#fff" stroke-width="2" fill="none"/>
                    </g>
                </svg>`,
                options: [
                    { text: "Автомобиль на кольце", isCorrect: true, rationale: "По умолчанию при въезде на круговое движение (знак 4.3) водитель уступает дорогу всем ТС, движущимся по кругу." },
                    { text: "Вы (по помехе справа)", isCorrect: false, rationale: "Для кольца сделано исключение: главными являются те, кто уже едет по кругу." }
                ]
            },

            // 4. Помеха справа
            {
                id: 4,
                topic: "Равнозначный перекресток",
                question: "Равнозначный перекресток без знаков и светофоров. Вы едете прямо, справа приближается красный автомобиль. Кто должен уступить?",
                svg: `<svg viewBox="0 0 400 280" class="svg-canvas">
                    <rect width="400" height="280" fill="#0f172a"/>
                    <rect x="0" y="90" width="400" height="100" fill="#334155"/>
                    <rect x="150" y="0" width="100" height="280" fill="#334155"/>
                    <g transform="translate(165, 200)">
                        <rect width="30" height="50" rx="6" fill="#2563eb"/>
                        <text x="15" y="30" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">ВЫ</text>
                    </g>
                    <g transform="translate(270, 105)">
                        <rect width="50" height="30" rx="6" fill="#dc2626"/>
                        <text x="25" y="19" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">СПРАВА</text>
                    </g>
                </svg>`,
                options: [
                    { text: "Вы должны уступить", isCorrect: true, rationale: "На равнозначных дорогах действует правило «помехи справа»: уступает тот, у кого справа приближается ТС." },
                    { text: "Красный автомобиль должен уступить", isCorrect: false, rationale: "У вас помеха справа, поэтому преимущество у красного автомобиля." }
                ]
            },

            // 5. Остановка перед зеброй
            {
                id: 5,
                topic: "Остановка и стоянка",
                question: "На каком минимальном расстоянии ДО пешеходного перехода разрешена остановка?",
                svg: `<svg viewBox="0 0 400 280" class="svg-canvas">
                    <rect width="400" height="280" fill="#0f172a"/>
                    <rect x="50" y="0" width="300" height="280" fill="#334155"/>
                    <g transform="translate(50, 80)">
                        <rect x="0" y="0" width="300" height="30" fill="#334155"/>
                        <rect x="10" y="5" width="35" height="20" fill="#fff"/>
                        <rect x="60" y="5" width="35" height="20" fill="#fff"/>
                        <rect x="110" y="5" width="35" height="20" fill="#fff"/>
                        <rect x="160" y="5" width="35" height="20" fill="#fff"/>
                        <rect x="210" y="5" width="35" height="20" fill="#fff"/>
                    </g>
                    <g transform="translate(220, 170)">
                        <rect width="40" height="65" rx="6" fill="#2563eb"/>
                        <text x="20" y="38" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">ВЫ</text>
                    </g>
                    <line x1="200" y1="110" x2="200" y2="170" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
                    <text x="175" y="145" fill="#f59e0b" font-size="14" font-weight="bold">? метров</text>
                </svg>`,
                options: [
                    { text: "5 метров", isCorrect: true, rationale: "Останавливаться запрещено ближе 5 метров перед пешеходным переходом. Сразу ЗА переходом остановка разрешена." },
                    { text: "3 метра", isCorrect: false, rationale: "3 метра — это минимальное расстояние от машины до сплошной линии разметки." },
                    { text: "10 метров", isCorrect: false, rationale: "Правило требует минимум 5 метров." }
                ]
            },

            // 6. Поворот налево на зеленый
            {
                id: 6,
                topic: "Маневрирование",
                question: "Вы поворачиваете налево по зеленому сигналу светофора. Встречный автомобиль едет прямо. Кому вы обязаны уступить?",
                svg: `<svg viewBox="0 0 400 280" class="svg-canvas">
                    <rect width="400" height="280" fill="#0f172a"/>
                    <rect x="0" y="90" width="400" height="100" fill="#334155"/>
                    <rect x="150" y="0" width="100" height="280" fill="#334155"/>
                    <g transform="translate(165, 200)">
                        <rect width="30" height="50" rx="6" fill="#2563eb"/>
                        <text x="15" y="30" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">ВЫ</text>
                    </g>
                    <g transform="translate(205, 20)">
                        <rect width="30" height="50" rx="6" fill="#dc2626"/>
                        <text x="15" y="30" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">ВСТР</text>
                    </g>
                </svg>`,
                options: [
                    { text: "Встречному автомобилю", isCorrect: true, rationale: "При повороте налево или развороте на зеленый свет уступаем встречным ТС, идущим прямо или направо." },
                    { text: "Никому, так как у вас зеленый", isCorrect: false, rationale: "У встречного автомобиля тоже горит зеленый сигнал светофора." }
                ]
            },

            // 7. Знак аварийной остановки
            {
                id: 7,
                topic: "Аварийная остановка",
                question: "На каком минимальном расстоянии от авто выставляется знак аварийной остановки В НАСЕЛЕННОМ ПУНКТЕ?",
                svg: `<svg viewBox="0 0 400 280" class="svg-canvas">
                    <rect width="400" height="280" fill="#0f172a"/>
                    <rect x="0" y="80" width="400" height="120" fill="#334155"/>
                    <g transform="translate(250, 115)">
                        <rect width="70" height="45" rx="6" fill="#2563eb"/>
                        <text x="35" y="27" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">ДТП</text>
                    </g>
                    <g transform="translate(80, 125)">
                        <polygon points="12,0 0,24 24,24" fill="#dc2626" stroke="#fff" stroke-width="2"/>
                    </g>
                    <line x1="95" y1="170" x2="250" y2="170" stroke="#f59e0b" stroke-width="2"/>
                    <text x="160" y="190" fill="#f59e0b" font-size="13" font-weight="bold">? метров</text>
                </svg>`,
                options: [
                    { text: "15 метров", isCorrect: true, rationale: "В городе знак выставляется не менее чем за 15 м, за городом — не менее чем за 30 м." },
                    { text: "30 метров", isCorrect: false, rationale: "30 метров — требование для дорог вне населенных пунктов." },
                    { text: "10 метров", isCorrect: false, rationale: "10 метров недостаточно по регламенту ПДД." }
                ]
            },

            // 8. Сплошная линия
            {
                id: 8,
                topic: "Обгон и разметка",
                question: "Разрешен ли обгон тихоходного грузовика с пересечением сплошной линии разметки 1.1?",
                svg: `<svg viewBox="0 0 400 280" class="svg-canvas">
                    <rect width="400" height="280" fill="#0f172a"/>
                    <rect x="0" y="60" width="400" height="160" fill="#334155"/>
                    <line x1="0" y1="140" x2="400" y2="140" stroke="#fff" stroke-width="4"/>
                    <g transform="translate(200, 155)">
                        <rect width="80" height="40" rx="4" fill="#64748b"/>
                        <text x="40" y="24" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">30 км/ч</text>
                    </g>
                    <g transform="translate(80, 155)">
                        <rect width="45" height="35" rx="5" fill="#2563eb"/>
                        <text x="22" y="22" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">ВЫ</text>
                    </g>
                </svg>`,
                options: [
                    { text: "Запрещен", isCorrect: true, rationale: "Пересекать сплошную линию 1.1 для обгона категорически запрещено, даже если перед вами тихоход." },
                    { text: "Разрешен, если он едет со знаком «Тихоходное ТС»", isCorrect: false, rationale: "Сплошную 1.1 пересекать нельзя. Выезд разрешен только если установлен знак 3.20 с прерывистой линией." }
                ]
            },

            // 9. Скорость в жилой зоне
            {
                id: 9,
                topic: "Скоростной режим",
                question: "Какая максимальная скорость разрешена при движении в жилой зоне и на дворовых территориях?",
                svg: `<svg viewBox="0 0 400 280" class="svg-canvas">
                    <rect width="400" height="280" fill="#0f172a"/>
                    <g transform="translate(140, 50)">
                        <rect width="120" height="170" rx="8" fill="#2563eb" stroke="#fff" stroke-width="3"/>
                        <text x="60" y="45" fill="#fff" font-size="32" text-anchor="middle">🏡</text>
                        <text x="60" y="95" fill="#fff" font-size="28" text-anchor="middle">🚗</text>
                        <text x="60" y="145" fill="#fff" font-size="28" text-anchor="middle">🚶</text>
                    </g>
                </svg>`,
                options: [
                    { text: "20 км/ч", isCorrect: true, rationale: "В жилой зоне (знак 5.21) и во дворах максимальная скорость для всех ТС — 20 км/ч." },
                    { text: "10 км/ч", isCorrect: false, rationale: "10 км/ч — слишком низкий лимит." },
                    { text: "60 км/ч", isCorrect: false, rationale: "60 км/ч — стандарт для обычных городских улиц." }
                ]
            },

            // 10. Обгон на зебре
            {
                id: 10,
                topic: "Пешеходный переход",
                question: "Разрешен ли обгон на нерегулируемом пешеходном переходе?",
                svg: `<svg viewBox="0 0 400 280" class="svg-canvas">
                    <rect width="400" height="280" fill="#0f172a"/>
                    <rect x="0" y="60" width="400" height="160" fill="#334155"/>
                    <g transform="translate(200, 60)">
                        <rect width="30" height="160" fill="#334155"/>
                        <rect x="5" y="10" width="20" height="25" fill="#fff"/>
                        <rect x="5" y="45" width="20" height="25" fill="#fff"/>
                        <rect x="5" y="80" width="20" height="25" fill="#fff"/>
                        <rect x="5" y="115" width="20" height="25" fill="#fff"/>
                    </g>
                    <g transform="translate(140, 160)">
                        <rect width="45" height="30" rx="5" fill="#2563eb"/>
                        <text x="22" y="19" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">ВЫ</text>
                    </g>
                </svg>`,
                options: [
                    { text: "Запрещен в любом случае", isCorrect: true, rationale: "Обгон на пешеходном переходе запрещен ВСЕГДА, вне зависимости от наличия на нем пешеходов." },
                    { text: "Разрешен, если на переходе нет пешеходов", isCorrect: false, rationale: "Данное правило было отменено, теперь обгон запрещен всегда." }
                ]
            },

            // 11. Табличка 8.13 (Главная дорога меняет направление)
            {
                id: 11,
                topic: "Знаки приоритета",

                        <text x="25" y="22" fill="#fff" font-size="14" text-anchor="middle">🚧</text>
                    </g>
                </svg>`,
                options: [
                    { text: "Разрешен, если невозможно объехать справа", isCorrect: true, rationale: "При невозможности объезда препятствия справа разрешается объехать его слева с пересечением линии 1.1 при уступке встречке." },
                    { text: "Запрещен в любом случае", isCorrect: false, rationale: "Неподвижное препятствие допускается объезжать слева, если нет возможности объехать справа." }
                ]
            },

            // 29. Тонировка
            {
                id: 29,
                topic: "Допуск ТС к эксплуатации",
                question: "Какова минимально допустимая светопропускаемость лобового и передних боковых стекол авто?",
                svg: `<svg viewBox="0 0 400 280" class="svg-canvas">
                    <rect width="400" height="280" fill="#0f172a"/>
                    <text x="200" y="140" fill="#38bdf8" font-size="48" text-anchor="middle">🚘 🕶️</text>
                </svg>`,
                options: [
                    { text: "Не менее 70%", isCorrect: true, rationale: "Светопропускаемость ветрового стекла и передних боковых стекол должна составлять не менее 70%." },
                    { text: "Не менее 50%", isCorrect: false, rationale: "50% недопустимо по ГОСТу." }
                ]
            },

            // 30. Аптечка и огнетушитель
            {
                id: 30,
                topic: "Допуск ТС к эксплуатации",
                question: "Какие из предметов обязательны к наличию в легковом автомобиле?",
                svg: `<svg viewBox="0 0 400 280" class="svg-canvas">
                    <rect width="400" height="280" fill="#0f172a"/>
                    <text x="200" y="140" fill="#f1f5f9" font-size="40" text-anchor="middle">🧰 🧯 ⚠️</text>
                </svg>`,
                options: [
                    { text: "Аптечка, огнетушитель, знак аварийной остановки", isCorrect: true, rationale: "Согласно правилам допуска, в легковом авто должны быть медицинская аптечка, огнетушитель и знак аварийной остановки." },
                    { text: "Только аптечка и знак аварийной остановки", isCorrect: false, rationale: "Огнетушитель также является обязательным предметом оснащения ТС." }
                ]
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            const q = questions[currentIdx];

            document.getElementById('question-tracker').innerText = `Вопрос ${currentIdx + 1} из ${questions.length}`;
            document.getElementById('progress-percent').innerText = `${Math.round(((currentIdx + 1) / questions.length) * 100)}%`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
            
            document.getElementById('topic-tag').innerText = q.topic;
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('svg-container').innerHTML = q.svg;

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';

            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl bg-slate-700/60 hover:bg-slate-700 border border-slate-600 transition flex items-center justify-between group";
                btn.onclick = () => selectOption(idx);
                btn.innerHTML = `
                    <span class="text-sm md:text-base font-medium text-slate-200 group-hover:text-white">${opt.text}</span>
                    <span class="w-5 h-5 rounded-full border border-slate-500 flex items-center justify-center text-xs shrink-0 ml-3"></span>
                `;
                optsContainer.appendChild(btn);
            });
        }

        function selectOption(optIdx) {
            if (answered) return;
            answered = true;

            const q = questions[currentIdx];
            const selectedOpt = q.options[optIdx];
            const buttons = document.getElementById('options-container').children;

            if (selectedOpt.isCorrect) {
                score++;
                document.getElementById('current-score').innerText = score;
                buttons[optIdx].className = "w-full text-left p-4 rounded-xl bg-emerald-500/20 border-2 border-emerald-500 text-emerald-200 font-medium flex items-center justify-between";
                showExplanation(true, "Правильно! 🎉", selectedOpt.rationale);
            } else {
                buttons[optIdx].className = "w-full text-left p-4 rounded-xl bg-rose-500/20 border-2 border-rose-500 text-rose-200 font-medium flex items-center justify-between";
                
                q.options.forEach((o, i) => {
                    if (o.isCorrect) {
                        buttons[i].className = "w-full text-left p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/50 text-emerald-300 font-medium flex items-center justify-between";
                    }
                });

                showExplanation(false, "Ошибка! ❌", selectedOpt.rationale);
            }

            document.getElementById('next-btn').classList.remove('hidden');
        }

        function showExplanation(isCorrect, title, rationale) {
            const expBox = document.getElementById('explanation-box');
            const expTitle = document.getElementById('explanation-title');
            const expText = document.getElementById('explanation-text');

            expBox.classList.remove('hidden', 'bg-emerald-500/10', 'border-emerald-500/30', 'bg-rose-500/10', 'border-rose-500/30');

            if (isCorrect) {
                expBox.classList.add('bg-emerald-500/10', 'border-emerald-500/30');
                expTitle.className = "font-bold text-sm mb-1 text-emerald-400";
            } else {
                expBox.classList.add('bg-rose-500/10', 'border-rose-500/30');
                expTitle.className = "font-bold text-sm mb-1 text-rose-400";
            }

            expTitle.innerText = title;
            expText.innerText = rationale;
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < questions.length) {
                loadQuestion();
            } else {
                showEndCard();
            }
        }

        function showEndCard() {
            document.getElementById('quiz-card').classList.add('hidden');
            document.getElementById('end-card').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;

            const msg = document.getElementById('feedback-message');
            if (score >= 28) {
                msg.innerText = "Отличный результат! Вы превосходно знаете теорию ПДД и готовы к сдаче экзамена в ГИБДД.";
            } else if (score >= 23) {
                msg.innerText = "Хороший результат! Вы допустили лишь незначительные ошибки. Повторите заваленные темы перед экзаменом.";
            } else {
                msg.innerText = "Рекомендуем ещё раз внимательно прорешать билеты и изучить правила дорожного движения.";
            }
        }

        function restartQuiz() {
            currentIdx = 0;
            score = 0;
            document.getElementById('current-score').innerText = 0;
            document.getElementById('end-card').classList.add('hidden');
            document.getElementById('quiz-card').classList.remove('hidden');
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
